<!-- Juego -->
<section id="juego" class="mb-10">
<h2 class="text-2xl font-bold mb-3">2) Juego</h2>
<div class="bg-white rounded-2xl border p-4 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
<div class="flex items-center gap-3">
<label class="text-sm">Minutos:</label>
<input id="minutos" type="number" min="1" value="30" class="w-24 px-3 py-2 rounded-xl border" />
</div>
<div class="flex items-center gap-2">
<button id="btnIniciar" class="px-3 py-2 rounded-xl bg-green-600 text-white text-sm">Iniciar</button>
<button id="btnPausar" class="px-3 py-2 rounded-xl bg-yellow-400 text-slate-900 text-sm">Pausar</button>
<button id="btnReanudar" class="px-3 py-2 rounded-xl bg-blue-600 text-white text-sm">Reanudar</button>
<button id="btnFinalizar" class="px-3 py-2 rounded-xl bg-rose-600 text-white text-sm">Finalizar</button>
</div>
<div class="text-3xl font-extrabold tabular-nums" id="displayTiempo">00:30:00</div>
</div>
</section>


<!-- Registro -->
<section id="registro" class="mb-10">
<h2 class="text-2xl font-bold mb-3">3) Registro de Producción</h2>
<div class="bg-white rounded-2xl border p-4">
<table class="min-w-full text-sm">
<thead>
<tr class="bg-slate-100 text-slate-700">
<th class="p-2">Equipo</th>
<th class="p-2">Cubos Válidos</th>
<th class="p-2">Calidad (0–5)</th>
<th class="p-2">Puntos</th>
</tr>
</thead>
<tbody id="tbodyProduccion"></tbody>
</table>
</div>
</section>


<!-- Eventos -->
<section id="eventos" class="mb-10">
<h2 class="text-2xl font-bold mb-3">4) Bitácora de Eventos</h2>
<div class="bg-white rounded-2xl border p-4 flex flex-col gap-3">
<div class="flex flex-wrap gap-2 items-center">
<select id="eventoEquipo" class="px-3 py-2 rounded-xl border"></select>
<select id="eventoTipo" class="px-3 py-2 rounded-xl border">
<option value="trueque">Trueque</option>
<option value="donacion">Donación</option>
<option value="alianza">Alianza</option>
<option value="sancion">Sanción</option>
</select>
<input id="eventoDetalle" placeholder="Detalles" class="px-3 py-2 rounded-xl border flex-1" />
<button id="btnAgregarEvento" class="px-3 py-2 rounded-xl bg-indigo-600 text-white text-sm">Añadir</button>
</div>
<ul id="listaEventos" class="list-disc pl-6 text-sm"></ul>
</div>
</section>


<footer class="text-xs text-slate-500 mb-6">
<p>Creado para uso en aula. Adaptable a cada centro.</p>
</footer>
</div>
<script src="dinamica-cubos.js"></script>
